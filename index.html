<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FINANZA AI</title>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  padding:20px;
  max-width:1000px;
  margin:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.stats{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.stat{
  background:#eef2ff;
  padding:15px;
  border-radius:10px;
  min-width:180px;
  cursor:pointer;
  transition:0.3s;
}

.stat:hover{
  background:#dbeafe;
  transform:translateY(-2px);
}

.value{
  font-size:28px;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<h1>💰 FINANZA AI</h1>

<h2>👨‍👩‍👧‍👦 Mi Familia</h2>

<p><strong>Hogar:</strong> Finanzas Per</p>

<div class="stats">

<div class="stat">
<div class="value">1</div>
<div>Integrantes</div>
</
