<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FINANZA AI - Tarjetas</title>
<link rel="stylesheet" href="./assets/styles.css">
<style>
.cards-dashboard{
  width:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:20px;
}
.cards-section{
  padding:20px;
  border:1px solid #e4eaf2;
  border-radius:14px;
  background:#fff;
}

.cards-stats{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:14px;
}

.cards-stat{
  min-width:0;
  padding:16px;
  border:1px solid #dce7f7;
  border-radius:12px;
  background:#f4f9ff;
}

.cards-stat-value{
   margin-top:5px;
  color:#66738a;
  font-size:11px;
  font-weight:600;
}
  color:#17233a;
  font-size:28px;
  font-weight:700;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th{
  background:#eef2ff;
  padding:12px;
  text-align:left;
}

.table td{
  padding:12px;
  border-bottom:1px solid #ddd;
}

input,
select{
  width:100%;
  max-width:400px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:6px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

#mensaje{
  margin-top:15px;
  color:green;
  font-weight:bold;
}
  .cards-form-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:14px;
}

.cards-form-field{
  min-width:0;
}

.cards-form-field.full{
  grid-column:1 / -1;
}

.cards-form-field label{
  display:block;
  margin-bottom:6px;
  color:#17233a;
  font-size:11px;
  font-weight:700;
}

.cards-form-field input,
.cards-form-field select{
  width:100%;
  max-width:none;
  box-sizing:border-box;
}

.cards-form-actions{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:16px;
}
.cards-section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.cards-section-header h2{
  margin:0;
}

.cards-form-panel{
  display:none;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #e4eaf2;
}

.cards-form-panel.open{
  display:block;
}

.payment-date{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}

.payment-date-overdue{
  border:1px solid #fecaca;
  background:#fef2f2;
  color:#b91c1c;
}

.payment-date-urgent{
  border:1px solid #fed7aa;
  background:#fff7ed;
  color:#c2410c;
}

.payment-date-warning{
  border:1px solid #fde68a;
  background:#fffbeb;
  color:#a16207;
}

.payment-date-safe{
  border:1px solid #bbf7d0;
  background:#f0fdf4;
  color:#15803d;
}

.payment-date-empty{
  border:1px solid #e2e8f0;
  background:#f8fafc;
  color:#64748b;
}

.payment-date-wrap{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:5px;
}

.payment-date-value{
  color:#66738a;
  font-size:10px;
  font-weight:600;
  white-space:nowrap;
}
  
@media (max-width:900px){
  .cards-stats{
    grid-template-columns:repeat(2, minmax(0, 1fr));
  }
}

@media (max-width:520px){
  .cards-stats,
  .cards-form-grid{
    grid-template-columns:1fr;
  }

  .cards-form-field.full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="cards-dashboard">

<div class="cards-section">

<h1>💳 Tarjetas</h1>

<p>
Gestión centralizada de tarjetas del hogar.
</p>
</div>

<div class="cards-section">

<h2>📊 Resumen de Tarjetas</h2>

<div class="cards-stats">

<div class="cards-stat">
<div class="cards-stat-value" id="cupoTotal">$0</div>
<div class="cards-stat-label">Cupo Total</div>
</div>

<div class="cards-stat">
<div class="cards-stat-value" id="saldoUtilizado">$0</div>
<div class="cards-stat-label">Saldo Utilizado</div>
</div>

<div class="cards-stat">
<div class="cards-stat-value" id="cupoDisponible">$0</div>
<div class="cards-stat-label">Cupo Disponible</div>
</div>

<div class="cards-stat">
<div class="cards-stat-value" id="pagoMinimo">$0</div>
<div class="cards-stat-label">Pago Mínimo</div>
</div>

</div>

</div>

<div class="cards-section">

<div class="cards-section-header">
  <h2>Registrar tarjeta</h2>

  <button
    type="button"
    class="secondary-button"
    id="toggleCardForm"
    aria-controls="cardFormPanel"
    aria-expanded="false">
    + Registrar tarjeta
  </button>
</div>

<div
  class="cards-form-panel"
  id="cardFormPanel">

  <form id="formTarjeta">

  <div class="cards-form-grid">

    <div class="cards-form-field">
      <label for="entidad_financiera">
        Entidad financiera
      </label>

    <div class="cards-form-field">

      </label>
      <input

    <div class="cards-form-field">

      <input

        step="0.01"

    <div class="cards-form-field">
      <label for="pago_total">
        Pago total del estado de cuenta
      </label>
      <input
        type="number"
        id="pago_total"
        min="0"

    <div class="cards-form-field">

        Fecha de corte
      </label>
      <input
        type="date"
        id="fecha_corte">
    </div>

    <div class="cards-form-field">

        type="date"

    <div class="cards-form-field">
      <label for="tasa_interes">

      </label>

    </div>
<div class="cards-form-field">
  <label for="estado_pago">
    Estado de pago
  </label>

  <select id="estado_pago" required>
    <option value="pendiente">
      Pendiente
    </option>

    <option value="parcial">
      Pago parcial
    </option>

    <option value="pagada">
      Pagada
    </option>
  </select>
</div>
  </div>

  <div class="cards-form-actions">
    <button type="submit">
      Guardar tarjeta
    </button>
  </div>

</form>

<div
  id="mensaje"
  role="status"
  aria-live="polite">
</div>

</div>

<div class="cards-section">

<h2>💳 Tarjetas Registradas</h2>

<table class="table">

<thead>
<tr>
  <th>Entidad</th>
  <th>Tarjeta</th>
  <th>Cupo</th>
  <th>Saldo</th>
  <th>Disponible</th>
  <th>Pago mínimo</th>
  <th>Fecha de pago</th>
</tr>
</thead>

<tbody id="tablaTarjetas">

<tr>
<td colspan="7">
  Cargando...
</td>
</tr>

</tbody>

</table>

</div>

</div>

<script>

let hogarActualId = null;

const moneda = new Intl.NumberFormat("es-EC", {
  style: "currency",
  currency: "USD",
  minimumFractionDigits: 2
});

function obtenerEstadoVencimiento(valor) {
  if (!valor) {
    return {
      clase: "payment-date-empty",
      texto: "Sin definir"
    };
  }

  const partes = String(valor).split("-");

  if (partes.length !== 3) {
    return {
      clase: "payment-date-empty",
      texto: "Fecha inválida"
    };
  }

  const anio = Number(partes[0]);
  const mes = Number(partes[1]) - 1;
  const dia = Number(partes[2]);

  const fechaPago = new Date(anio, mes, dia);

  if (Number.isNaN(fechaPago.getTime())) {
    return {
      clase: "payment-date-empty",
      texto: "Fecha inválida"
    };
  }

  const hoy = new Date();

  hoy.setHours(0, 0, 0, 0);
  fechaPago.setHours(0, 0, 0, 0);

  const milisegundosPorDia =
    1000 * 60 * 60 * 24;

  const diasRestantes = Math.round(
    (fechaPago - hoy) / milisegundosPorDia
  );

  if (diasRestantes < 0) {
    return {
      clase: "payment-date-overdue",
      texto: "Vencida"
    };
  }

  if (diasRestantes === 0) {
    return {
      clase: "payment-date-urgent",
      texto: "Vence hoy"
    };
  }

  if (diasRestantes <= 3) {
    return {
      clase: "payment-date-urgent",
      texto: `Vence en ${diasRestantes} días`
    };
  }

  if (diasRestantes <= 7) {
    return {
      clase: "payment-date-warning",
      texto: `Vence en ${diasRestantes} días`
    };
  }

  return {
    clase: "payment-date-safe",
    texto: `Faltan ${diasRestantes} días`
  };
}
  
function formatearFecha(valor) {
  if (!valor) {
    return "Sin definir";
  }

  const partes = String(valor).split("-");

  if (partes.length !== 3) {
    return String(valor);
  }

  const anio = Number(partes[0]);
  const mes = Number(partes[1]) - 1;
  const dia = Number(partes[2]);

  const fecha = new Date(anio, mes, dia);

  if (Number.isNaN(fecha.getTime())) {
    return String(valor);
  }

  return new Intl.DateTimeFormat("es-EC", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  })
    .format(fecha)
    .replace(".", "");
}
  
function escaparHTML(valor) {
  return String(valor ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}  
  
async function cargarContextoFinanciero() {
  const respuestaHogares =
    await fetch("/api/hogares");

  if (!respuestaHogares.ok) {
    throw new Error(
      "No fue posible obtener los datos del hogar."
    );
  }

  const resultadoHogares =
    await respuestaHogares.json();

  const hogares = Array.isArray(resultadoHogares)
    ? resultadoHogares
    : Array.isArray(resultadoHogares.data)
      ? resultadoHogares.data
      : [];

  const hogarActivo =
    hogares.find(
      (item) => item.status === "active"
    ) || hogares[0];

  if (!hogarActivo) {
    throw new Error(
      "No existe un hogar configurado."
    );
  }

  hogarActualId = hogarActivo.id;
}

async function cargarTarjetas() {
  const response =
    await fetch("/api/tarjetas");

  if (!response.ok) {
    throw new Error(
      "No fue posible consultar las tarjetas."
    );
  }

  const resultado =
    await response.json();

  const tarjetas = Array.isArray(resultado)
    ? resultado
    : Array.isArray(resultado.data)
      ? resultado.data
      : [];
  
  let cupoTotal = 0;
  let saldoUtilizado = 0;
  let cupoDisponible = 0;
  let pagoMinimo = 0;

  tarjetas.forEach(item => {

    cupoTotal += Number(item.cupo || 0);

    saldoUtilizado += Number(item.saldo_actual || 0);

    cupoDisponible += Number(item.cupo_disponible || 0);

    pagoMinimo += Number(item.pago_minimo || 0);

  });

 document.getElementById("cupoTotal").textContent =
  moneda.format(cupoTotal);

document.getElementById("saldoUtilizado").textContent =
  moneda.format(saldoUtilizado);

document.getElementById("cupoDisponible").textContent =
  moneda.format(cupoDisponible);

document.getElementById("pagoMinimo").textContent =
  moneda.format(pagoMinimo);

  const tabla =
    document.getElementById('tablaTarjetas');

  if (tarjetas.length === 0) {

    tabla.innerHTML = `
      <tr>
        <td colspan="7">
  No existen tarjetas registradas
</td>
      </tr>
    `;

    return;
  }

 tabla.innerHTML = "";

tarjetas.forEach((item) => {
  const estadoVencimiento =
    obtenerEstadoVencimiento(item.fecha_pago);

  tabla.innerHTML += `
    <tr>
      <td>
        ${escaparHTML(item.entidad_financiera)}
      </td>

      <td>
        ${escaparHTML(item.nombre_tarjeta)}
      </td>

      <td>
        ${moneda.format(Number(item.cupo || 0))}
      </td>

      <td>
        ${moneda.format(
          Number(item.saldo_actual || 0)
        )}
      </td>

      <td>
        ${moneda.format(
          Number(item.cupo_disponible || 0)
        )}
      </td>

      <td>
        ${moneda.format(
          Number(item.pago_minimo || 0)
        )}
      </td>

<td>
  <div class="payment-date-wrap">
    <span
      class="payment-date ${estadoVencimiento.clase}">
      ${escaparHTML(estadoVencimiento.texto)}
    </span>

    ${
      item.fecha_pago
        ? `
          <span class="payment-date-value">
            ${escaparHTML(
              formatearFecha(item.fecha_pago)
            )}
          </span>
        `
        : ""
    }
  </div>
</td>
    </tr>
  `;
});
}

const botonFormulario =
  document.getElementById("toggleCardForm");

const panelFormulario =
  document.getElementById("cardFormPanel");

botonFormulario.addEventListener("click", () => {
  const estaAbierto =
    panelFormulario.classList.contains("open");

  if (estaAbierto) {
    panelFormulario.classList.remove("open");

    botonFormulario.setAttribute(
      "aria-expanded",
      "false"
    );

    botonFormulario.textContent =
      "+ Registrar tarjeta";

    return;
  }

  panelFormulario.classList.add("open");

  botonFormulario.setAttribute(
    "aria-expanded",
    "true"
  );

  botonFormulario.textContent =
    "Cerrar formulario";

  document
    .getElementById("entidad_financiera")
    .focus();
});

const campoCupo =
  document.getElementById("cupo");

const campoSaldoActual =
  document.getElementById("saldo_actual");

const campoCupoDisponible =
  document.getElementById("cupo_disponible");

function actualizarCupoDisponible() {
  const cupo = Number(campoCupo.value);
  const saldoActual = Number(campoSaldoActual.value);

  if (
    !Number.isFinite(cupo) ||
    !Number.isFinite(saldoActual) ||
    cupo < 0 ||
    saldoActual < 0
  ) {
    campoCupoDisponible.value = "";
    return;
  }

  const disponible = cupo - saldoActual;

  campoCupoDisponible.value =
    disponible >= 0
      ? disponible.toFixed(2)
      : "0.00";
}

campoCupo.addEventListener(
  "input",
  actualizarCupoDisponible
);

campoSaldoActual.addEventListener(
  "input",
  actualizarCupoDisponible
);
  
document
  .getElementById("formTarjeta")
  .addEventListener("submit", async (e) => {
    e.preventDefault();

    
    const formulario =
      document.getElementById("formTarjeta");

    const mensaje =
      document.getElementById("mensaje");

    const botonGuardar =
      formulario.querySelector('button[type="submit"]');

    mensaje.textContent = "";

    if (!formulario.checkValidity()) {
      formulario.reportValidity();

      mensaje.textContent =
        "Revisa los campos obligatorios.";

      return;
    }

   if (!hogarActualId) {
  mensaje.textContent =
    "No fue posible identificar el hogar.";

  return;
}
const entidadFinanciera =
  document
    .getElementById("entidad_financiera")
    .value
    .trim();

const nombreTarjeta =
  document
    .getElementById("nombre_tarjeta")
    .value
    .trim();

const titular =
  document
    .getElementById("titular")
    .value
    .trim();

const fechaCorte =
  document.getElementById("fecha_corte").value;

const fechaPago =
  document.getElementById("fecha_pago").value;

const estadoPago =
  document.getElementById("estado_pago").value;

const estadosPermitidos = [
  "pendiente",
  "parcial",
  "pagada"
];

if (!estadosPermitidos.includes(estadoPago)) {
  mensaje.textContent =
    "Selecciona un estado de pago válido.";

  document.getElementById("estado_pago").focus();
  return;
}
    
if (
  entidadFinanciera.length < 2 ||
  entidadFinanciera.length > 120
) {
  mensaje.textContent =
    "La entidad financiera debe tener entre 2 y 120 caracteres.";

  document.getElementById("entidad_financiera").focus();
  return;
}

if (
  nombreTarjeta.length < 2 ||
  nombreTarjeta.length > 80
) {
  mensaje.textContent =
    "El nombre de la tarjeta debe tener entre 2 y 80 caracteres.";

  document.getElementById("nombre_tarjeta").focus();
  return;
}

if (
  titular.length < 2 ||
  titular.length > 120
) {
  mensaje.textContent =
    "El nombre del titular debe tener entre 2 y 120 caracteres.";

  document.getElementById("titular").focus();
  return;
}

if (fechaCorte) {
  const fechaCorteValida =
    new Date(`${fechaCorte}T00:00:00`);

  if (Number.isNaN(fechaCorteValida.getTime())) {
    mensaje.textContent =
      "La fecha de corte no es válida.";

    document.getElementById("fecha_corte").focus();
    return;
  }
}

if (fechaPago) {
  const fechaPagoValida =
    new Date(`${fechaPago}T00:00:00`);

  if (Number.isNaN(fechaPagoValida.getTime())) {
    mensaje.textContent =
      "La fecha máxima de pago no es válida.";

    document.getElementById("fecha_pago").focus();
    return;
  }
}

const cupo = Number(
  document.getElementById("cupo").value
);

const saldoActual = Number(
  document.getElementById("saldo_actual").value
);

const cupoDisponible = Number(
  document.getElementById("cupo_disponible").value
);

const pagoMinimo = Number(
  document.getElementById("pago_minimo").value
);

const pagoTotal = Number(
  document.getElementById("pago_total").value
);

const tasaInteres = Number(
  document.getElementById("tasa_interes").value || 0
);

if (!Number.isFinite(cupo) || cupo <= 0) {
  mensaje.textContent =
    "El cupo total debe ser mayor que cero.";

  document.getElementById("cupo").focus();
  return;
}

if (
  !Number.isFinite(saldoActual) ||
  saldoActual < 0 ||
  saldoActual > cupo
) {
  mensaje.textContent =
    "El saldo utilizado debe estar entre cero y el cupo total.";

  document.getElementById("saldo_actual").focus();
  return;
}

if (
  !Number.isFinite(cupoDisponible) ||
  cupoDisponible < 0 ||
  cupoDisponible > cupo
) {
  mensaje.textContent =
    "El cupo disponible debe estar entre cero y el cupo total.";

  document.getElementById("cupo_disponible").focus();
  return;
}

if (
  Math.abs(
    cupo - saldoActual - cupoDisponible
  ) > 0.02
) {
  mensaje.textContent =
    "El saldo utilizado más el cupo disponible debe coincidir con el cupo total.";

  document.getElementById("cupo_disponible").focus();
  return;
}

if (
  !Number.isFinite(pagoMinimo) ||
  pagoMinimo < 0 ||
  pagoMinimo > saldoActual
) {
  mensaje.textContent =
    "El pago mínimo no puede superar el saldo utilizado.";

  document.getElementById("pago_minimo").focus();
  return;
}

if (
  !Number.isFinite(pagoTotal) ||
  pagoTotal < 0 ||
  pagoTotal > saldoActual
) {
  mensaje.textContent =
    "El pago total no puede superar el saldo utilizado.";

  document.getElementById("pago_total").focus();
  return;
}

if (
  pagoTotal > 0 &&
  pagoMinimo > pagoTotal
) {
  mensaje.textContent =
    "El pago mínimo no puede superar el pago total.";

  document.getElementById("pago_minimo").focus();
  return;
}

if (
  !Number.isFinite(tasaInteres) ||
  tasaInteres < 0 ||
  tasaInteres > 100
) {
  mensaje.textContent =
    "La tasa de interés debe estar entre 0 y 100.";

  document.getElementById("tasa_interes").focus();
  return;
}

mensaje.textContent = "Guardando tarjeta...";
    botonGuardar.disabled = true;
    botonGuardar.textContent = "Guardando...";

    try {
      const response = await fetch("/api/tarjetas", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          hogar_id: hogarActualId,

         entidad_financiera: entidadFinanciera,

nombre_tarjeta: nombreTarjeta,

titular: titular,

         cupo: cupo,

        saldo_actual: saldoActual,

        cupo_disponible: cupoDisponible,

        pago_minimo: pagoMinimo,

        pago_total: pagoTotal,

         fecha_corte: fechaCorte,

        fecha_pago: fechaPago,

          tasa_interes: tasaInteres,
          
         saldo_diferido: 0,
        cuotas_pendientes: 0,
        estado_pago: estadoPago
        })
      });

    const textoRespuesta = await response.text();

let resultado = {};

if (textoRespuesta) {
  try {
    resultado = JSON.parse(textoRespuesta);
  } catch {
    resultado = {};
  }
}

if (!response.ok || resultado.success === false) {
  const esErrorCloudflare =
    textoRespuesta.includes("Worker threw exception") ||
    textoRespuesta.includes("Error 1101");

  if (esErrorCloudflare) {
    throw new Error(
      "La API de tarjetas presentó un error interno."
    );
  }

  throw new Error(
    resultado.error ||
    resultado.message ||
    `Error ${response.status} al guardar la tarjeta.`
  );
}
      mensaje.textContent =
  "Tarjeta registrada correctamente.";

formulario.reset();

panelFormulario.classList.remove("open");

botonFormulario.setAttribute(
  "aria-expanded",
  "false"
);

botonFormulario.textContent =
  "+ Registrar tarjeta";

await cargarTarjetas();
    } catch (error) {
      console.error(
        "Error al guardar la tarjeta:",
        error
      );

      mensaje.textContent =
        error.message ||
        "No fue posible guardar la tarjeta.";
    } finally {
      botonGuardar.disabled = false;
      botonGuardar.textContent = "Guardar tarjeta";
    }
  });
  
async function iniciarPagina() {
  const mensaje =
    document.getElementById("mensaje");

  try {
    await cargarContextoFinanciero();
    await cargarTarjetas();
  } catch (error) {
    console.error(
      "Error al iniciar la página de tarjetas:",
      error
    );

    mensaje.textContent =
      error.message ||
      "No fue posible iniciar la página.";
  }
}

iniciarPagina();

</script>
