<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FINANZA AI - Tarjetas</title>
<link rel="stylesheet" href="./assets/styles.css">
<style>
.cards-dashboard{
  width:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:20px;
}
.cards-section{
  padding:20px;
  border:1px solid #e4eaf2;
  border-radius:14px;
  background:#fff;
}

.cards-stats{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:14px;
}

.cards-stat{
  min-width:0;
  padding:16px;
  border:1px solid #dce7f7;
  border-radius:12px;
  background:#f4f9ff;
}

.cards-stat-value{
   margin-top:5px;
  color:#66738a;
  font-size:11px;
  font-weight:600;
}
  color:#17233a;
  font-size:28px;
  font-weight:700;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th{
  background:#eef2ff;
  padding:12px;
  text-align:left;
}

.table td{
  padding:12px;
  border-bottom:1px solid #ddd;
}

input,
select{
  width:100%;
  max-width:400px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:6px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

#mensaje{
  margin-top:15px;
  color:green;
  font-weight:bold;
}
  .cards-form-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:14px;
}

.cards-form-field{
  min-width:0;
}

.cards-form-field.full{
  grid-column:1 / -1;
}

.cards-form-field label{
  display:block;
  margin-bottom:6px;
  color:#17233a;
  font-size:11px;
  font-weight:700;
}

.cards-form-field input,
.cards-form-field select{
  width:100%;
  max-width:none;
  box-sizing:border-box;
}

.cards-form-actions{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:16px;
}
@media (max-width:900px){
  .cards-stats{
    grid-template-columns:repeat(2, minmax(0, 1fr));
  }
}

@media (max-width:520px){
  .cards-stats,
  .cards-form-grid{
    grid-template-columns:1fr;
  }

  .cards-form-field.full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="cards-dashboard">

<div class="cards-section">

<h1>💳 Tarjetas</h1>

<p>
Gestión centralizada de tarjetas del hogar.
</p>

<a href="index.html">
⬅ Volver al inicio
</a>

</div>

<div class="cards-section">

<h2>📊 Resumen de Tarjetas</h2>

<div class="cards-stats">

<div class="cards-stat">
<div class="cards-stat-value" id="cupoTotal">$0</div>
<div class="cards-stat-label">Cupo Total</div>
</div>

<div class="cards-stat">
<div class="cards-stat-value" id="saldoUtilizado">$0</div>
<div class="cards-stat-label">Saldo Utilizado</div>
</div>

<div class="cards-stat">
<div class="cards-stat-value" id="cupoDisponible">$0</div>
<div class="cards-stat-label">Cupo Disponible</div>
</div>

<div class="cards-stat">
<div class="cards-stat-value" id="pagoMinimo">$0</div>
<div class="cards-stat-label">Pago Mínimo</div>
</div>

</div>

</div>

<div class="cards-section">

<h2>➕ Registrar Tarjeta</h2>

<form id="formTarjeta">

<p>
<label>Entidad Financiera</label><br>
<input type="text" id="entidad_financiera" required>
</p>

<p>
<label>Nombre Tarjeta</label><br>
<input type="text" id="nombre_tarjeta" required>
</p>

<p>
<label>Titular</label><br>
<input type="text" id="titular" required>
</p>

<p>
<label>Cupo</label><br>
<input type="number" id="cupo" required>
</p>

<p>
<label>Saldo Actual</label><br>
<input type="number" id="saldo_actual" required>
</p>

<p>
<label>Cupo Disponible</label><br>
<input type="number" id="cupo_disponible" required>
</p>

<p>
<label>Pago Mínimo</label><br>
<input type="number" id="pago_minimo" required>
</p>

<p>
<label>Pago Total</label><br>
<input type="number" id="pago_total" required>
</p>

<p>
<label>Fecha Corte</label><br>
<input type="date" id="fecha_corte">
</p>

<p>
<label>Fecha Pago</label><br>
<input type="date" id="fecha_pago">
</p>

<p>
<label>Tasa Interés (%)</label><br>
<input type="number" step="0.01" id="tasa_interes">
</p>

<button type="submit">
Guardar Tarjeta
</button>

</form>

<div id="mensaje"></div>

</div>

<div class="cards-section">

<h2>💳 Tarjetas Registradas</h2>

<table class="table">

<thead>
<tr>
<th>Entidad</th>
<th>Tarjeta</th>
<th>Cupo</th>
<th>Saldo</th>
<th>Disponible</th>
<th>Pago Mínimo</th>
</tr>
</thead>

<tbody id="tablaTarjetas">

<tr>
<td colspan="6">
Cargando...
</td>
</tr>

</tbody>

</table>

</div>

</div>

<script>

async function cargarTarjetas() {

  const response =
    await fetch('/api/tarjetas');

  const tarjetas =
    await response.json();

  let cupoTotal = 0;
  let saldoUtilizado = 0;
  let cupoDisponible = 0;
  let pagoMinimo = 0;

  tarjetas.forEach(item => {

    cupoTotal += Number(item.cupo || 0);

    saldoUtilizado += Number(item.saldo_actual || 0);

    cupoDisponible += Number(item.cupo_disponible || 0);

    pagoMinimo += Number(item.pago_minimo || 0);

  });

  document.getElementById('cupoTotal').textContent =
    '$' + cupoTotal.toFixed(2);

  document.getElementById('saldoUtilizado').textContent =
    '$' + saldoUtilizado.toFixed(2);

  document.getElementById('cupoDisponible').textContent =
    '$' + cupoDisponible.toFixed(2);

  document.getElementById('pagoMinimo').textContent =
    '$' + pagoMinimo.toFixed(2);

  const tabla =
    document.getElementById('tablaTarjetas');

  if (tarjetas.length === 0) {

    tabla.innerHTML = `
      <tr>
        <td colspan="6">
          No existen tarjetas registradas
        </td>
      </tr>
    `;

    return;
  }

  tabla.innerHTML = '';

  tarjetas.forEach(item => {

    tabla.innerHTML += `
      <tr>
        <td>${item.entidad_financiera}</td>
        <td>${item.nombre_tarjeta}</td>
        <td>$${item.cupo}</td>
        <td>$${item.saldo_actual}</td>
        <td>$${item.cupo_disponible}</td>
        <td>$${item.pago_minimo}</td>
      </tr>
    `;

  });

}

document
.getElementById('formTarjeta')
.addEventListener('submit', async (e) => {

  e.preventDefault();

  await fetch('/api/tarjetas', {

    method:'POST',

    headers:{
      'Content-Type':'application/json'
    },

    body:JSON.stringify({

      hogar_id:'hogar-001',

      entidad_financiera:
        document.getElementById('entidad_financiera').value,

      nombre_tarjeta:
        document.getElementById('nombre_tarjeta').value,

      titular:
        document.getElementById('titular').value,

      cupo:
        Number(document.getElementById('cupo').value),

      saldo_actual:
        Number(document.getElementById('saldo_actual').value),

      cupo_disponible:
        Number(document.getElementById('cupo_disponible').value),

      pago_minimo:
        Number(document.getElementById('pago_minimo').value),

      pago_total:
        Number(document.getElementById('pago_total').value),

      fecha_corte:
        document.getElementById('fecha_corte').value,

      fecha_pago:
        document.getElementById('fecha_pago').value,

      tasa_interes:
        Number(document.getElementById('tasa_interes').value),

      saldo_diferido:0,

      cuotas_pendientes:0,

      observaciones:''

    })

  });

  document.getElementById('mensaje').innerHTML =
    '✅ Tarjeta registrada correctamente';

  document.getElementById('formTarjeta').reset();

  await cargarTarjetas();

});

cargarTarjetas();

</script>

<script src="./assets/layout.js"></script>

</body>
</html>
