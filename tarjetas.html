<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FINANZA AI - Tarjetas</title>
<link rel="stylesheet" href="./assets/styles.css">
<style>
.cards-dashboard{
  width:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:20px;
}
.cards-section{
  padding:20px;
  border:1px solid #e4eaf2;
  border-radius:14px;
  background:#fff;
}

.cards-stats{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:14px;
}

.cards-stat{
  min-width:0;
  padding:16px;
  border:1px solid #dce7f7;
  border-radius:12px;
  background:#f4f9ff;
}

.cards-stat-value{
   margin-top:5px;
  color:#66738a;
  font-size:11px;
  font-weight:600;
}
  color:#17233a;
  font-size:28px;
  font-weight:700;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th{
  background:#eef2ff;
  padding:12px;
  text-align:left;
}

.table td{
  padding:12px;
  border-bottom:1px solid #ddd;
}

input,
select{
  width:100%;
  max-width:400px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:6px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

#mensaje{
  margin-top:15px;
  color:green;
  font-weight:bold;
}
  .cards-form-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:14px;
}

.cards-form-field{
  min-width:0;
}

.cards-form-field.full{
  grid-column:1 / -1;
}

.cards-form-field label{
  display:block;
  margin-bottom:6px;
  color:#17233a;
  font-size:11px;
  font-weight:700;
}

.cards-form-field input,
.cards-form-field select{
  width:100%;
  max-width:none;
  box-sizing:border-box;
}

.cards-form-actions{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:16px;
}
.cards-section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.cards-section-header h2{
  margin:0;
}

.cards-form-panel{
  display:none;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #e4eaf2;
}

.cards-form-panel.open{
  display:block;
}

@media (max-width:900px){
  .cards-stats{
    grid-template-columns:repeat(2, minmax(0, 1fr));
  }
}

@media (max-width:520px){
  .cards-stats,
  .cards-form-grid{
    grid-template-columns:1fr;
  }

  .cards-form-field.full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="cards-dashboard">

<div class="cards-section">

<h1>💳 Tarjetas</h1>

<p>
Gestión centralizada de tarjetas del hogar.
</p>
</div>

<div class="cards-section">

<h2>📊 Resumen de Tarjetas</h2>

<div class="cards-stats">

<div class="cards-stat">
<div class="cards-stat-value" id="cupoTotal">$0</div>
<div class="cards-stat-label">Cupo Total</div>
</div>

<div class="cards-stat">
<div class="cards-stat-value" id="saldoUtilizado">$0</div>
<div class="cards-stat-label">Saldo Utilizado</div>
</div>

<div class="cards-stat">
<div class="cards-stat-value" id="cupoDisponible">$0</div>
<div class="cards-stat-label">Cupo Disponible</div>
</div>

<div class="cards-stat">
<div class="cards-stat-value" id="pagoMinimo">$0</div>
<div class="cards-stat-label">Pago Mínimo</div>
</div>

</div>

</div>

<div class="cards-section">

<div class="cards-section-header">
  <h2>Registrar tarjeta</h2>

  <button
    type="button"
    class="secondary-button"
    id="toggleCardForm"
    aria-controls="cardFormPanel"
    aria-expanded="false">
    + Registrar tarjeta
  </button>
</div>

<div
  class="cards-form-panel"
  id="cardFormPanel">

  <form id="formTarjeta">

  <div class="cards-form-grid">

    <div class="cards-form-field">
      <label for="entidad_financiera">
        Entidad financiera
      </label>
      <input
        type="text"
        id="entidad_financiera"
        placeholder="Ej. Banco Pichincha"
        required>
    </div>

    <div class="cards-form-field">
      <label for="nombre_tarjeta">
        Nombre de la tarjeta
      </label>
      <input
        type="text"
        id="nombre_tarjeta"
        placeholder="Ej. Visa"
        required>
    </div>

    <div class="cards-form-field">
      <label for="titular">
        Titular
      </label>
      <input
        type="text"
        id="titular"
        placeholder="Nombre del titular"
        required>
    </div>

    <div class="cards-form-field">
      <label for="cupo">
        Cupo total
      </label>
      <input
        type="number"
        id="cupo"
        min="0"
        step="0.01"
        placeholder="0.00"
        required>
    </div>

    <div class="cards-form-field">
      <label for="saldo_actual">
        Saldo utilizado
      </label>
      <input
        type="number"
        id="saldo_actual"
        min="0"
        step="0.01"
        placeholder="0.00"
        required>
    </div>

    <div class="cards-form-field">
      <label for="cupo_disponible">
        Cupo disponible
      </label>
      <input
        type="number"
        id="cupo_disponible"
        min="0"
        step="0.01"
        placeholder="0.00"
        required>
    </div>

    <div class="cards-form-field">
      <label for="pago_minimo">
        Pago mínimo
      </label>
      <input
        type="number"
        id="pago_minimo"
        min="0"
        step="0.01"
        placeholder="0.00"
        required>
    </div>

    <div class="cards-form-field">
      <label for="pago_total">
        Pago total del estado de cuenta
      </label>
      <input
        type="number"
        id="pago_total"
        min="0"
        step="0.01"
        placeholder="0.00"
        required>
    </div>

    <div class="cards-form-field">
      <label for="fecha_corte">
        Fecha de corte
      </label>
      <input
        type="date"
        id="fecha_corte">
    </div>

    <div class="cards-form-field">
      <label for="fecha_pago">
        Fecha máxima de pago
      </label>
      <input
        type="date"
        id="fecha_pago">
    </div>

    <div class="cards-form-field">
      <label for="tasa_interes">
        Tasa de interés anual (%)
      </label>
      <input
        type="number"
        id="tasa_interes"
        min="0"
        max="100"
        step="0.01"
        placeholder="Ej. 15.50">
    </div>

  </div>

  <div class="cards-form-actions">
    <button type="submit">
      Guardar tarjeta
    </button>
  </div>

</form>

<div
  id="mensaje"
  role="status"
  aria-live="polite">
</div>

</div>

<div class="cards-section">

<h2>💳 Tarjetas Registradas</h2>

<table class="table">

<thead>
<tr>
<th>Entidad</th>
<th>Tarjeta</th>
<th>Cupo</th>
<th>Saldo</th>
<th>Disponible</th>
<th>Pago Mínimo</th>
</tr>
</thead>

<tbody id="tablaTarjetas">

<tr>
<td colspan="6">
Cargando...
</td>
</tr>

</tbody>

</table>

</div>

</div>

<script>

let hogarActualId = null;

const moneda = new Intl.NumberFormat("es-EC", {
  style: "currency",
  currency: "USD",
  minimumFractionDigits: 2
});

function escaparHTML(valor) {
  return String(valor ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}  
  
async function cargarContextoFinanciero() {
  const respuestaHogares =
    await fetch("/api/hogares");

  if (!respuestaHogares.ok) {
    throw new Error(
      "No fue posible obtener los datos del hogar."
    );
  }

  const resultadoHogares =
    await respuestaHogares.json();

  const hogares = Array.isArray(resultadoHogares)
    ? resultadoHogares
    : Array.isArray(resultadoHogares.data)
      ? resultadoHogares.data
      : [];

  const hogarActivo =
    hogares.find(
      (item) => item.status === "active"
    ) || hogares[0];

  if (!hogarActivo) {
    throw new Error(
      "No existe un hogar configurado."
    );
  }

  hogarActualId = hogarActivo.id;
}

async function cargarTarjetas() {
  const response =
    await fetch("/api/tarjetas");

  if (!response.ok) {
    throw new Error(
      "No fue posible consultar las tarjetas."
    );
  }

  const resultado =
    await response.json();

  const tarjetas = Array.isArray(resultado)
    ? resultado
    : Array.isArray(resultado.data)
      ? resultado.data
      : [];
  
  let cupoTotal = 0;
  let saldoUtilizado = 0;
  let cupoDisponible = 0;
  let pagoMinimo = 0;

  tarjetas.forEach(item => {

    cupoTotal += Number(item.cupo || 0);

    saldoUtilizado += Number(item.saldo_actual || 0);

    cupoDisponible += Number(item.cupo_disponible || 0);

    pagoMinimo += Number(item.pago_minimo || 0);

  });

 document.getElementById("cupoTotal").textContent =
  moneda.format(cupoTotal);

document.getElementById("saldoUtilizado").textContent =
  moneda.format(saldoUtilizado);

document.getElementById("cupoDisponible").textContent =
  moneda.format(cupoDisponible);

document.getElementById("pagoMinimo").textContent =
  moneda.format(pagoMinimo);

  const tabla =
    document.getElementById('tablaTarjetas');

  if (tarjetas.length === 0) {

    tabla.innerHTML = `
      <tr>
        <td colspan="6">
          No existen tarjetas registradas
        </td>
      </tr>
    `;

    return;
  }

  tabla.innerHTML = '';

  tarjetas.forEach((item) => {
  tabla.innerHTML += `
    <tr>
      <td>
        ${escaparHTML(item.entidad_financiera)}
      </td>
      <td>
        ${escaparHTML(item.nombre_tarjeta)}
      </td>
      <td>
        ${moneda.format(Number(item.cupo || 0))}
      </td>
      <td>
        ${moneda.format(Number(item.saldo_actual || 0))}
      </td>
      <td>
        ${moneda.format(Number(item.cupo_disponible || 0))}
      </td>
      <td>
        ${moneda.format(Number(item.pago_minimo || 0))}
      </td>
    </tr>
  `;
});

}

document
  .getElementById("formTarjeta")
  .addEventListener("submit", async (e) => {
    e.preventDefault();

    
    const formulario =
      document.getElementById("formTarjeta");

    const mensaje =
      document.getElementById("mensaje");

    const botonGuardar =
      formulario.querySelector('button[type="submit"]');

    mensaje.textContent = "";

    if (!formulario.checkValidity()) {
      formulario.reportValidity();

      mensaje.textContent =
        "Revisa los campos obligatorios.";

      return;
    }

   if (!hogarActualId) {
  mensaje.textContent =
    "No fue posible identificar el hogar.";

  return;
}
const entidadFinanciera =
  document
    .getElementById("entidad_financiera")
    .value
    .trim();

const nombreTarjeta =
  document
    .getElementById("nombre_tarjeta")
    .value
    .trim();

const titular =
  document
    .getElementById("titular")
    .value
    .trim();

const fechaCorte =
  document.getElementById("fecha_corte").value;

const fechaPago =
  document.getElementById("fecha_pago").value;

if (
  entidadFinanciera.length < 2 ||
  entidadFinanciera.length > 120
) {
  mensaje.textContent =
    "La entidad financiera debe tener entre 2 y 120 caracteres.";

  document.getElementById("entidad_financiera").focus();
  return;
}

if (
  nombreTarjeta.length < 2 ||
  nombreTarjeta.length > 80
) {
  mensaje.textContent =
    "El nombre de la tarjeta debe tener entre 2 y 80 caracteres.";

  document.getElementById("nombre_tarjeta").focus();
  return;
}

if (
  titular.length < 2 ||
  titular.length > 120
) {
  mensaje.textContent =
    "El nombre del titular debe tener entre 2 y 120 caracteres.";

  document.getElementById("titular").focus();
  return;
}

if (fechaCorte) {
  const fechaCorteValida =
    new Date(`${fechaCorte}T00:00:00`);

  if (Number.isNaN(fechaCorteValida.getTime())) {
    mensaje.textContent =
      "La fecha de corte no es válida.";

    document.getElementById("fecha_corte").focus();
    return;
  }
}

if (fechaPago) {
  const fechaPagoValida =
    new Date(`${fechaPago}T00:00:00`);

  if (Number.isNaN(fechaPagoValida.getTime())) {
    mensaje.textContent =
      "La fecha máxima de pago no es válida.";

    document.getElementById("fecha_pago").focus();
    return;
  }
}

const cupo = Number(
  document.getElementById("cupo").value
);

const saldoActual = Number(
  document.getElementById("saldo_actual").value
);

const cupoDisponible = Number(
  document.getElementById("cupo_disponible").value
);

const pagoMinimo = Number(
  document.getElementById("pago_minimo").value
);

const pagoTotal = Number(
  document.getElementById("pago_total").value
);

const tasaInteres = Number(
  document.getElementById("tasa_interes").value || 0
);

if (!Number.isFinite(cupo) || cupo <= 0) {
  mensaje.textContent =
    "El cupo total debe ser mayor que cero.";

  document.getElementById("cupo").focus();
  return;
}

if (
  !Number.isFinite(saldoActual) ||
  saldoActual < 0 ||
  saldoActual > cupo
) {
  mensaje.textContent =
    "El saldo utilizado debe estar entre cero y el cupo total.";

  document.getElementById("saldo_actual").focus();
  return;
}

if (
  !Number.isFinite(cupoDisponible) ||
  cupoDisponible < 0 ||
  cupoDisponible > cupo
) {
  mensaje.textContent =
    "El cupo disponible debe estar entre cero y el cupo total.";

  document.getElementById("cupo_disponible").focus();
  return;
}

if (
  Math.abs(
    cupo - saldoActual - cupoDisponible
  ) > 0.02
) {
  mensaje.textContent =
    "El saldo utilizado más el cupo disponible debe coincidir con el cupo total.";

  document.getElementById("cupo_disponible").focus();
  return;
}

if (
  !Number.isFinite(pagoMinimo) ||
  pagoMinimo < 0 ||
  pagoMinimo > saldoActual
) {
  mensaje.textContent =
    "El pago mínimo no puede superar el saldo utilizado.";

  document.getElementById("pago_minimo").focus();
  return;
}

if (
  !Number.isFinite(pagoTotal) ||
  pagoTotal < 0 ||
  pagoTotal > saldoActual
) {
  mensaje.textContent =
    "El pago total no puede superar el saldo utilizado.";

  document.getElementById("pago_total").focus();
  return;
}

if (
  pagoTotal > 0 &&
  pagoMinimo > pagoTotal
) {
  mensaje.textContent =
    "El pago mínimo no puede superar el pago total.";

  document.getElementById("pago_minimo").focus();
  return;
}

if (
  !Number.isFinite(tasaInteres) ||
  tasaInteres < 0 ||
  tasaInteres > 100
) {
  mensaje.textContent =
    "La tasa de interés debe estar entre 0 y 100.";

  document.getElementById("tasa_interes").focus();
  return;
}

mensaje.textContent = "Guardando tarjeta...";
    botonGuardar.disabled = true;
    botonGuardar.textContent = "Guardando...";

    try {
      const response = await fetch("/api/tarjetas", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          hogar_id: hogarActualId,

         entidad_financiera: entidadFinanciera,

nombre_tarjeta: nombreTarjeta,

titular: titular,

         cupo: cupo,

saldo_actual: saldoActual,

cupo_disponible: cupoDisponible,

pago_minimo: pagoMinimo,

pago_total: pagoTotal,

         fecha_corte: fechaCorte,

fecha_pago: fechaPago,

          tasa_interes: tasaInteres,
          
         saldo_diferido: 0,
cuotas_pendientes: 0
        })
      });

    const textoRespuesta = await response.text();

let resultado = {};

if (textoRespuesta) {
  try {
    resultado = JSON.parse(textoRespuesta);
  } catch {
    resultado = {};
  }
}

if (!response.ok || resultado.success === false) {
  const esErrorCloudflare =
    textoRespuesta.includes("Worker threw exception") ||
    textoRespuesta.includes("Error 1101");

  if (esErrorCloudflare) {
    throw new Error(
      "La API de tarjetas presentó un error interno."
    );
  }

  throw new Error(
    resultado.error ||
    resultado.message ||
    `Error ${response.status} al guardar la tarjeta.`
  );
}
      mensaje.textContent =
        "Tarjeta registrada correctamente.";

      formulario.reset();

      await cargarTarjetas();
    } catch (error) {
      console.error(
        "Error al guardar la tarjeta:",
        error
      );

      mensaje.textContent =
        error.message ||
        "No fue posible guardar la tarjeta.";
    } finally {
      botonGuardar.disabled = false;
      botonGuardar.textContent = "Guardar tarjeta";
    }
  });
  
async function iniciarPagina() {
  const mensaje =
    document.getElementById("mensaje");

  try {
    await cargarContextoFinanciero();
    await cargarTarjetas();
  } catch (error) {
    console.error(
      "Error al iniciar la página de tarjetas:",
      error
    );

    mensaje.textContent =
      error.message ||
      "No fue posible iniciar la página.";
  }
}

iniciarPagina();

</script>

<script src="./assets/layout.js"></script>

</body>
</html>
