<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FINANZA AI - Tarjetas</title>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  padding:20px;
  max-width:1200px;
  margin:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.stats{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.stat{
  background:#eef2ff;
  padding:15px;
  border-radius:10px;
  min-width:180px;
}

.value{
  font-size:28px;
  font-weight:bold;
}

.action{
  background:#dbeafe;
  padding:15px;
  border-radius:10px;
  min-width:220px;
}

.table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

.table th{
  background:#eef2ff;
  padding:12px;
  text-align:left;
}

.table td{
  padding:12px;
  border-bottom:1px solid #ddd;
}

.alert{
  background:#fff7ed;
  border-left:4px solid #f97316;
  padding:15px;
  border-radius:8px;
  margin-bottom:10px;
}
