<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FINANZA AI - Presupuesto y Ahorro</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    max-width:1200px;
    margin:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.stats{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.stat{
    background:#eef2ff;
    padding:15px;
    border-radius:10px;
    min-width:180px;
}

.value{
    font-size:28px;
    font-weight:bold;
}

.action{
    background:#dbeafe;
    padding:15px;
    border-radius:10px;
    min-width:220px;
}

.table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

.table th{
    background:#eef2ff;
    padding:12px;
    text-align:left;
}

.table td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

.alert{
    background:#fff7ed;
    border-left:4px solid #f97316;
    padding:15px;
    border-radius:8px;
    margin-bottom:10px;
}

.success{
    background:#ecfdf5;
    border-left:4px solid #10b981;
    padding:15px;
    border-radius:8px;
    margin-bottom:10px;
}

.progress{
    background:#e5e7eb;
    border-radius:10px;
    height:20px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:20px;
    background:#10b981;
}

a{
    text-decoration:none;
}

hr{
    margin-top:30px;
    margin-bottom:30px;
}

</style>

</head>

<body>

<div class="card">

<h1>📈 Presupuesto y Ahorro</h1>

<p>
Administración inteligente del presupuesto y objetivos financieros
